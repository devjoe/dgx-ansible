---
- name: restart vllm
  ansible.builtin.systemd:
    name: vllm
    state: restarted
    daemon_reload: true

- name: restart vllm pna proxy
  ansible.builtin.systemd:
    name: vllm-pna-proxy
    state: restarted
    daemon_reload: true
  when: vllm_private_network_cors_enabled | default(false)
